plugins {
    id 'java'
}

group = 'desafio'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // JUnit 5
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.0.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.0.3'
    testImplementation 'org.junit.platform:junit-platform-suite:1.10.2'
    
    // RestAssured & Datafaker
    testImplementation 'io.rest-assured:rest-assured:6.0.0'
    testImplementation 'net.datafaker:datafaker:2.5.4'
    
    // Cucumber
    testImplementation 'io.cucumber:cucumber-java:7.33.0'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.34.3'

    //JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
}

test {
    useJUnitPlatform()
    
    // Configurações úteis para execução do Cucumber no Gradle
    systemProperty("cucumber.junit-platform.naming-strategy", "long")
    systemProperty("cucumber.plugin", "pretty, html:build/reports/cucumber/report.html")
    
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}